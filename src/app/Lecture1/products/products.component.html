<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 Products in Rows</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    .product-card {
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .product-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      background-color: #f4f4f4;
      margin-bottom: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">Product Grid</h1>
    <div class="row g-4">
      <!-- Product 1 -->
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/100" alt="Product 1" class="product-img">
          <h5>Product 1</h5>
          <p class="text-muted">$19.99</p>
        </div>
      </div>
      <!-- Product 2 -->
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/100" alt="Product 2" class="product-img">
          <h5>Product 2</h5>
          <p class="text-muted">$29.99</p>
        </div>
      </div>
      <!-- Product 3 -->
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/100" alt="Product 3" class="product-img">
          <h5>Product 3</h5>
          <p class="text-muted">$15.99</p>
        </div>
      </div>
      <!-- Product 4 -->
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/100" alt="Product 4" class="product-img">
          <h5>Product 4</h5>
          <p class="text-muted">$12.99</p>
        </div>
      </div>
      <!-- Product 5 -->
      <div class="col-12 col-sm-6 col-lg-4">

          <img src="https://via.placeholder.com/100" alt="Product 5" class="product-img">
          <h5>Product 5</h5>
          <p class="text-muted">$49.99</p>
        </div>
      </div>
      <!-- Product 6 -->
      <div class="col-12 col-sm-6 col-lg-4">

          <img src="https://via.placeholder.com/100" alt="Product 6" class="product-img">
          <h5>Product 6</h5>
          <p class="text-muted">$9.99</p>
        </div>
      </div>
      <!-- Product 7 -->
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="product-card">
          <img src="https://via.placeholder.com/100" alt="Product 7" class="product-img">
          <h5>Product 7</h5>

        </div>
      </div>

        </div>

        </div>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
